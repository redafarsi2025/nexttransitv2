name: NextTransit Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Typecheck & Decision Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & ESLint
        run: npm run lint

      - name: Run Decision Engine & Service Unit Tests (Vitest)
        run: npm test

      - name: Build Application (Vite & Express Server CJS Bundle)
        run: npm run build
        env:
          NODE_ENV: production
